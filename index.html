<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartera GSF · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#060a18; --bg2:#0b1226; --card:rgba(18,28,58,.62); --card2:rgba(26,40,80,.55); --line:rgba(140,170,255,.14);
  --tx:#e8eeff; --tx2:#9fb0d8; --tx3:#6d7ea8; --acc:#38bdf8; --acc2:#818cf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:18px; --sh:0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px -18px rgba(0,0,0,.8), 0 2px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.bgfx{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 500px at 10% -10%,rgba(56,189,248,.18),transparent 60%),
  radial-gradient(800px 600px at 100% 0%,rgba(129,140,248,.20),transparent 60%),
  radial-gradient(700px 500px at 50% 120%,rgba(52,211,153,.10),transparent 60%), var(--bg)}
.floor{position:fixed;left:-50%;right:-50%;bottom:-30vh;height:70vh;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(120,150,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.13) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(600px) rotateX(70deg);transform-origin:center top;
  mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 75%);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 75%)}
h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(6,10,24,.72);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.cube{width:34px;height:34px;perspective:200px;flex:none}
.cube .c{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube .f{position:absolute;inset:0;border:1.5px solid rgba(56,189,248,.9);background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(129,140,248,.25));border-radius:6px}
.cube .f:nth-child(1){transform:translateZ(17px)}.cube .f:nth-child(2){transform:rotateY(180deg) translateZ(17px)}
.cube .f:nth-child(3){transform:rotateY(90deg) translateZ(17px)}.cube .f:nth-child(4){transform:rotateY(-90deg) translateZ(17px)}
.cube .f:nth-child(5){transform:rotateX(90deg) translateZ(17px)}.cube .f:nth-child(6){transform:rotateX(-90deg) translateZ(17px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--tx3);font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 30px 8px 12px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s;box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 6px 14px -8px rgba(0,0,0,.7)}
.btn:hover{transform:translateY(-1px);background:rgba(40,60,120,.6)}
.btn:active{transform:translateY(1px)}
.btn.pri{color:#fff;background:linear-gradient(135deg,#0ea5e9,#6366f1);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 24px -10px rgba(56,130,248,.8),0 3px 0 #312e81}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--tx2);padding:8px 14px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center}
nav.tabs a.on{color:#fff;background:linear-gradient(135deg,rgba(14,165,233,.35),rgba(99,102,241,.35));border-color:rgba(129,140,248,.45);box-shadow:0 6px 18px -8px rgba(99,102,241,.8)}
nav.tabs a svg{width:15px;height:15px}
main{padding-top:18px}
section.view{display:none;animation:rise .45s ease both}
section.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.vhead h2{font-size:24px}
.vhead p{margin:4px 0 0;color:var(--tx2);font-size:13.5px;max-width:760px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
@media(max-width:980px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:520px){.g-kpi{grid-template-columns:1fr 1fr}.vhead h2{font-size:20px}.wrap{padding:0 12px}}
.card{position:relative;background:linear-gradient(180deg,var(--card),rgba(12,20,44,.7));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transform-style:preserve-3d;transition:transform .25s ease, box-shadow .25s ease}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.06),transparent 35%)}
.card h3{font-size:14.5px;font-weight:600;color:var(--tx);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card h3 small{font-family:Inter;font-weight:500;color:var(--tx3);font-size:12px}
.tilt{will-change:transform}
.kpi{padding:14px 16px 15px;overflow:hidden}
.kpi .lb{color:var(--tx2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.kpi .vl{font-family:'Space Grotesk';font-size:27px;font-weight:700;margin-top:8px;letter-spacing:-.02em;transform:translateZ(30px);text-shadow:0 6px 18px rgba(56,189,248,.25)}
.kpi .sb{color:var(--tx3);font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi .glow{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;filter:blur(30px);opacity:.45}
@media(max-width:520px){.kpi .vl{font-size:21px}.kpi{padding:12px}}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(148,163,184,.14);color:var(--tx2)}
.chip.up{background:rgba(52,211,153,.14);color:var(--ok)}.chip.down{background:rgba(248,113,113,.14);color:var(--bad)}.chip.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.chart{width:100%;height:320px}
.chart.tall{height:420px}.chart.short{height:240px}
@media(max-width:520px){.chart{height:280px}.chart.tall{height:360px}}
.ins{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);line-height:1.45}
.ins li i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--acc);box-shadow:0 0 12px currentColor}
.ins li.good i{background:var(--ok);color:var(--ok)}.ins li.warn i{background:var(--warn);color:var(--warn)}.ins li.bad i{background:var(--bad);color:var(--bad)}
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);max-height:520px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;background:#111c3a;color:var(--tx2);font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;cursor:pointer;z-index:1;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid rgba(140,170,255,.07);white-space:nowrap}
table.t tr:hover td{background:rgba(56,189,248,.06)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{position:sticky;bottom:0;background:#111c3a;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.inp:focus,.sel:focus{outline:2px solid rgba(56,189,248,.5);outline-offset:1px}
.muted{color:var(--tx3)}.tx2{color:var(--tx2)}
.badge{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:700}
.b0{background:rgba(52,211,153,.15);color:#34d399}.b1{background:rgba(163,230,53,.15);color:#a3e635}.b2{background:rgba(251,191,36,.15);color:#fbbf24}.b3{background:rgba(251,146,60,.15);color:#fb923c}.b4{background:rgba(248,113,113,.15);color:#f87171}.b5{background:rgba(225,29,72,.2);color:#fb7185}
.drop{border:2px dashed rgba(129,140,248,.45);border-radius:20px;padding:34px 18px;text-align:center;background:linear-gradient(180deg,rgba(99,102,241,.08),rgba(14,165,233,.04));transition:.2s;cursor:pointer}
.drop.over{border-color:var(--acc);background:rgba(56,189,248,.12);transform:scale(1.01)}
.drop h3{justify-content:center;font-size:18px}
.drop .big{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 14px 30px -12px rgba(99,102,241,.9),0 4px 0 #312e81;transform:rotateX(18deg)}
.replist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.rep{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.rep .dot{width:10px;height:10px;border-radius:50%;background:#334155;flex:none}
.rep.ok .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.rep .nm{flex:1;min-width:0;font-size:12.5px}.rep .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep .nm span{color:var(--tx3);font-size:11.5px}
.ctrl{display:grid;gap:14px}
.slider{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.slider label{font-size:12.5px;color:var(--tx2);font-weight:600}
.slider output{font-family:'Space Grotesk';font-weight:700;font-size:14px}
.slider input{grid-column:1/-1;width:100%;accent-color:#38bdf8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:rgba(56,189,248,.2);color:#fff}
.empty{padding:40px 16px;text-align:center;color:var(--tx2)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px;font-family:'Space Grotesk'}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:#16234a;border:1px solid rgba(129,140,248,.5);padding:11px 16px;border-radius:14px;z-index:99;transition:.3s;box-shadow:0 20px 40px -10px #000;max-width:92vw;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
.prog{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#6366f1);border-radius:9px;transition:width .3s}
.note{font-size:12.5px;color:var(--tx3);line-height:1.5;margin-top:8px}
.seedbar{margin:0 0 14px;padding:10px 14px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fde68a;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* Presentación */
.deck{position:relative}
.slide{aspect-ratio:16/9;width:100%;border-radius:16px;overflow:hidden;background:#fff;color:#0f1f3d;position:relative;box-shadow:0 30px 60px -25px rgba(0,0,0,.9);display:none;font-family:Inter}
.slide.on{display:block;animation:rise .35s ease both}
.slide .band{position:absolute;left:0;top:0;right:0;height:13%;background:linear-gradient(90deg,#0f2a52,#1f3a8a);color:#fff;display:flex;align-items:center;padding:0 4%;font-family:'Space Grotesk';font-weight:700;font-size:clamp(12px,2.4vw,26px)}
.slide .band small{margin-left:auto;font-family:Inter;font-weight:500;font-size:.55em;opacity:.8}
.slide .body{position:absolute;left:4%;right:4%;top:17%;bottom:9%}
.slide .foot{position:absolute;left:4%;right:4%;bottom:3%;font-size:clamp(7px,1vw,11px);color:#64748b;display:flex;justify-content:space-between}
.slide.cover{background:radial-gradient(circle at 80% 20%,#1e3a8a,#0b1530 60%);color:#fff}
.slide.cover .t1{position:absolute;left:7%;top:30%;font-family:'Space Grotesk';font-weight:700;font-size:clamp(18px,4.6vw,52px);line-height:1.05}
.slide.cover .t2{position:absolute;left:7%;top:58%;font-size:clamp(10px,1.8vw,20px);opacity:.85}
.slide.cover .bar{position:absolute;left:7%;top:53%;width:12%;height:5px;background:#38bdf8;border-radius:3px}
.skpis{display:grid;grid-template-columns:repeat(3,1fr);gap:3%;height:100%;align-content:center}
.skpi{background:#f1f5fb;border-radius:10px;padding:5% 6%;border-left:5px solid #2563eb}
.skpi .a{font-size:clamp(7px,1.1vw,13px);color:#475569;font-weight:600;text-transform:uppercase}
.skpi .b{font-family:'Space Grotesk';font-weight:700;font-size:clamp(12px,2.7vw,30px);color:#0f1f3d;margin-top:4%}
.skpi .c{font-size:clamp(7px,1vw,12px);color:#64748b;margin-top:2%}
.schart{width:100%;height:100%}
.slist{font-size:clamp(8px,1.35vw,16px);line-height:1.45;margin:0;padding-left:1.2em}
.slist li{margin-bottom:.6em}
.deckbar{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer}.dots i.on{background:var(--acc);width:22px;border-radius:5px}
.fs .slide{border-radius:0}
.legend-row{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:6px}
.legend-row span{display:inline-flex;align-items:center;gap:5px}.legend-row i{width:10px;height:10px;border-radius:3px;display:inline-block}
.patmap{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;max-height:300px;overflow:auto;padding-right:4px}
.patmap .k{font-size:12px;color:var(--tx2);align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.patmap{grid-template-columns:1fr}.patmap .k{margin-top:6px}}
.loader{position:fixed;inset:0;background:rgba(6,10,24,.75);backdrop-filter:blur(6px);z-index:80;display:none;place-items:center}
.loader.on{display:grid}
.loader .box{width:min(420px,90vw);padding:22px}
.spin{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;background:linear-gradient(135deg,#0ea5e9,#6366f1);animation:flip 1.2s infinite ease-in-out}
@keyframes flip{0%{transform:perspective(120px) rotateX(0) rotateY(0)}50%{transform:perspective(120px) rotateX(-180deg) rotateY(0)}100%{transform:perspective(120px) rotateX(-180deg) rotateY(-180deg)}}
.right{text-align:right}.mt{margin-top:14px}.mb{margin-bottom:14px}
.hide-sm{}@media(max-width:620px){.hide-sm{display:none!important}}

.grid>*{min-width:0}
@media(max-width:980px){#metaCtrl{order:2}}

.dropall{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(6,10,24,.82);backdrop-filter:blur(6px);border:3px dashed rgba(56,189,248,.8);border-radius:22px;margin:10px;pointer-events:none;text-align:center}
.dropall b{display:block;font-family:'Space Grotesk';font-size:24px;margin-top:6px}.dropall span{color:var(--tx2)}
.dropall .big{width:74px;height:74px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 14px 30px -12px rgba(99,102,241,.9),0 4px 0 #312e81}
body.dragging .dropall{display:grid}

.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(800px 500px at 20% 0%,rgba(56,189,248,.18),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(129,140,248,.2),transparent 60%),#060a18;padding:16px}
.lockbox{width:min(400px,100%);padding:26px 22px}

/* permisos por rol */
body.sin-carga #btnUpload,body.sin-carga #drop{display:none!important}
body.sin-descarga #dlGsf,body.sin-descarga #dlAna,body.sin-descarga #metaXls,body.sin-descarga #letXls,body.sin-descarga #letPpt,body.sin-descarga #pptBtn,body.sin-descarga #histExp{display:none!important}

header.top{padding-top:env(safe-area-inset-top)}</style>
</head><body>
<div class="bgfx"></div><div class="floor"></div>
<header class="top">
  <div class="wrap">
    <div class="topin">
      <div class="brand">
        <div class="cube"><div class="c"><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div></div></div>
        <div style="min-width:0"><h1>Cartera GSF · Dashboard</h1><small id="subtitle">Grupo de Servicios Financieros</small></div>
      </div>
      <select id="monthSel" class="sel" aria-label="Mes"></select>
      <button class="btn pri" id="btnUpload" title="Cargar reportes del mes"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><span class="hide-sm">Cargar mes</span></button>
      <button class="btn ghost sm" id="btnLogout" title="Salir" onclick="window.gsfLogout && window.gsfLogout()" style="display:none">Salir</button>
      <input type="file" id="fileIn" multiple accept=".xls,.xlsx,.XLS,.XLSX" hidden>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#resumen" data-v="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>Resumen</a>
      <a href="#morosidad" data-v="morosidad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Morosidad</a>
      <a href="#analisis" data-v="analisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-4 3 3 6-6"/></svg>Análisis</a>

tido 1000 veces; ninguna queda escrita en el c\u00f3digo.\n *\n * Hojas: Meses (totales + resumen JSON), Clientes (detalle por pr\u00e9stamo, opcional), Modelo (detalle comprimido),\n *        Config, Usuarios y Sesiones (se guarda la huella del token, no el token).\n */\n\nvar HOJA_ID = '';  // opcional: ID del Sheet si el script no est\u00e1 dentro de la hoja\nvar AJUSTES = { SESION_DIAS: 30, ITERACIONES: 1000, INTENTOS: 5, ESPERA_MIN: 15 };\nvar PARTE = 45000; // caracteres por celda (el l\u00edmite de Sheets es 50.000)\nvar COLS_USUARIOS = ['usuario', 'nombre', 'salt', 'hash', 'activo', 'esAdmin', 'debeCambiar', 'creado', 'rol', 'jefe', 'email', 'estado'];\nvar NOMBRE_APP = 'Cartera GSF \u00b7 Dashboard';\n/* Jerarqu\u00eda de roles (de mayor a menor) y lo que puede hacer cada uno:\n   admin     \u2192 todo, m\u00e1s crear usuarios y asignar roles\n   gerencia  \u2192 ver todo, cargar meses, borrar meses, cambiar supuestos de la meta, descargar Excel y presentaciones\n   analista  \u2192 ver todo, cargar meses y descargar (no borra meses ni cambia supuestos)\n   consulta  \u2192 solo ve los totales y gr\u00e1ficas del historial (sin detalle por cliente ni descargas) */\nvar ROLES = ['admin', 'gerencia', 'analista', 'consulta'];\nvar PERMISOS = {\n  admin: ['list', 'getModel', 'getFiles', 'getConfig', 'saveMonth', 'deleteMonth', 'saveConfig'],\n  gerencia: ['list', 'getModel', 'getFiles', 'getConfig', 'saveMonth', 'deleteMonth', 'saveConfig'],\n  analista: ['list', 'getModel', 'getFiles', 'getConfig', 'saveMonth'],\n  consulta: ['list', 'getConfig']\n};\nfunction rolDe_(u) { return u.esAdmin === 'TRUE' ? 'admin' : (ROLES.indexOf(u.rol) > 0 ? u.rol : 'consulta'); }\nvar COLS_SESIONES = ['huella', 'usuario', 'creado', 'ultimo', 'vence'];\nvar COLS_ARCHIVOS = ['Mes', 'Archivo', 'Parte', 'Datos']; // reportes originales del SIF (comprimidos) para volver a descargarlos\n\nfunction libro_() { return HOJA_ID ? SpreadsheetApp.openById(HOJA_ID) : SpreadsheetApp.getActiveS   if (jefe === usuario) throw err_('Una persona no puede reportarse a s\u00ed misma.');\n  var x = jefe, guard = 0;\n  while (x && guard++ < 50) { var p = usuario_(x); if (!p) throw err_('La persona a quien reporta no existe.'); if (x === usuario) throw err_('Esa relaci\u00f3n crea un c\u00edrculo en la jerarqu\u00eda.'); x = String(p.u.jefe || '').toLowerCase(); }\n  return jefe;\n}\nfunction soloAdmin_(me) { if (rolDe_(me) !== 'admin') throw err_('Solo la cuenta de administraci\u00f3n puede hacer esto.'); }\n\nfunction manejar_(b) {\n  b = b || {};\n  if (PUBLICAS[b.action]) return { ok: true, data: PUBLICAS[b.action](b) };\n  if (!PRIVADAS[b.action]) throw err_('Acci\u00f3n desconocida.');\n  var me = sesionUsuario_(b.token);\n  if (me.debeCambiar === 'TRUE' && b.action !== 'changePassword' && b.action !== 'ping') throw err_('DEBE_CAMBIAR');\n  var libres = ['ping', 'changePassword', 'listUsers', 'addUser', 'updateUser', 'setActive', 'approveUser', 'rejectUser'];\n  if (libres.indexOf(b.action) < 0 && PERMISOS[rolDe_(me)].indexOf(b.action) < 0) throw err_('Tu rol (' + rolDe_(me) + ') no permite esta acci\u00f3n.');\n  return { ok: true, data: PRIVADAS[b.action](b, me) };\n}\n\n/* ======================= Entrada web ======================= */\nfunction doGet() { return salida_({ ok: true, servicio: 'Dashboard de cartera GSF' }); }\nfunction doPost(e) {\n  var b = null, res;\n  try { b = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (x) { }\n  if (!b) return salida_({ ok: false, error: 'Solicitud inv\u00e1lida.' });\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(25000)) return salida_({ ok: false, error: 'El servidor est\u00e1 ocupado. Intenta de nuevo en unos segundos.' });\n  try { res = manejar_(b); }\n  catch (x) { res = { ok: false, error: x.usuario ? x.message : 'Error interno: ' + (x && x.message) }; }\n  finally { lock.releaseLock(); }\n  return salida_(res);\n}\nfunction salida_(o) { return ContentService.createText getRange(2, 1, n - 1, w).clearContent();\n  if (keep.length) sh.getRange(2, 1, keep.length, w).setValues(keep);\n}\n\nfunction guardarMes_(b) {\n  const agg = b.agg; if (!agg || !agg.month) throw new Error('Falta el resumen del mes');\n  const mes = agg.month; const k = agg.kpi || {};\n  const sh = hoja_('Meses', COLS_MESES); borrarFilas_(sh, mes);\n  const json = partes_(JSON.stringify(agg));\n  const fila = [mes, agg.label, new Date(), k.prestamos, k.cartera, k.montoOriginal, k.moroso, k.par30Pct, k.par30NMPct, k.recaudo, k.letrasMes, k.meta, k.interesesMes, k.gmMes, k.feciSaldo, k.segPrima, k.canceladosN, b.modelo ? 'S\u00ed' : 'No', json.length].concat(json);\n  sh.getRange(sh.getLastRow() + 1, 1, 1, fila.length).setValues([fila]);\n  const sc = hoja_('Clientes', COLS_CLIENTES); borrarFilasRapido_(sc, mes);\n  const sm = hoja_('Modelo', ['Mes', 'Parte', 'Datos']); borrarFilasRapido_(sm, mes);\n  const sa = hoja_('Archivos', COLS_ARCHIVOS); borrarFilasRapido_(sa, mes);\n  if (b.modelo && b.archivos && b.archivos.length) {\n    const filas = [];\n    b.archivos.forEach(a => partes_(String(a.data || '')).forEach((p, i) => filas.push([mes, String(a.nombre || 'reporte.xls').slice(0, 200), i + 1, p])));\n    sa.getRange(sa.getLastRow() + 1, 1, filas.length, 4).setNumberFormat('@').setValues(filas);\n  }\n  if (b.modelo) {\n    const ps = partes_(b.modelo);\n    sm.getRange(sm.getLastRow() + 1, 1, ps.length, 3).setNumberFormat('@').setValues(ps.map((p, i) => [mes, i + 1, p]));\n    const cl = b.clientes || [];\n    if (cl.length) sc.getRange(sc.getLastRow() + 1, 1, cl.length, COLS_CLIENTES.length).setValues(cl.map(r => [mes].concat(r).slice(0, COLS_CLIENTES.length)));\n  }\n  ordenar_(sh);\n  return mes;\n}\nfunction ordenar_(sh) { const n = sh.getLastRow(); if (n > 2) sh.getRange(2, 1, n - 1, sh.getLastColumn()).sort(1); }\n\nfunction listar_() {\n  const sh = libro_().getSheetByName('Meses'); if (!sh || sh.getLastRow() < 2) return [];\n  const n = sh.getLastRow(), w = sh.getLastColumn(); const vals = sh.getRange(2, 1, n - 1, w).getValues();\n  const base = COLS_MESES.length;\n  return vals.map(r => {\n    const np = Number(r[base - 1]) || 1; const txt = r.slice(base, base + np).join('');\n    let agg = null; try { agg = JSON.parse(txt); } catch (e) { }\n    return { month: String(r[0]), detalle: r[base - 2] === 'S\u00ed', agg };\n  }).filter(x => x.agg);\n}\nfunction leerModelo_(mes) {\n  const sh = libro_().getSheetByName('Modelo'); if (!sh || sh.getLastRow() < 2) return null;\n  const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues().filter(r => String(r[0]) === String(mes)).sort((a, b) => a[1] - b[1]);\n  return vals.length ? vals.map(r => r[2]).join('') : null;\n}\nfunction leerArchivos_(mes) {\n  const sh = libro_().getSheetByName('Archivos'); if (!sh || sh.getLastRow() < 2) return [];\n  const por = {}, orden = [];\n  sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues().filter(r => String(r[0]) === String(mes)).forEach(r => {\n    const n = String(r[1]); if (!por[n]) { por[n] = []; orden.push(n); } por[n].push([Number(r[2]), String(r[3])]);\n  });\n  return orden.map(n => ({ nombre: n, data: por[n].sort((a, b) => a[0] - b[0]).map(x => x[1]).join('') }));\n}\nfunction borrarMes_(mes) {\n  ['Meses', 'Clientes', 'Modelo', 'Archivos'].forEach(n => { const sh = libro_().getSheetByName(n); if (sh) (n === 'Meses' ? borrarFilas_ : borrarFilasRapido_)(sh, String(mes)); });\n}\nfunction leerConfig_() {\n  const sh = libro_().getSheetByName('Config'); if (!sh || sh.getLastRow() < 2) return null;\n  const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues(); const r = vals.find(v => v[0] === 'config');\n  try { return r ? JSON.parse(r[1]) : null; } catch (e) { return null; }\n}\nfunction guardarConfig_(cfg) {\n  const sh = hoja_('Config', ['Clave', 'Valor']); borrarFilas_(sh, 'config');\n  sh.getRange(sh.getLastRow() + 1, 1, 1, 2).setValues([['config', JSON.stringify(cfg)]]);\n}\n";</script>

      efectividadCuotas: 100,      // % de esas letras que se espera cobrar

  // ---------- utilidades ----------

  const freqName = f => ({ Q: 'Quincenal', M: 'Mensual', S: 'Semanal', D: 'Diario', B: 'Bimestral', T: 'Trimestral' })[str(f).toUpperCase()] || str(f);
  const monthLabel = ym => { if (!ym) return '—'; const [y, m] = ym.split('-'); return `${MESES[+m - 1]} ${y}`; };
  const lastDay = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
  const nextMonth = ym => { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${String(m).padStart(2, '0')}`; };

  // Letras que vencen en un mes: quincenal = día 15 y fin de mes; mensual = el día de la fecha final.

  function letrasEnMes(l, ym) {

    const f = String(l.freq || '').toUpperCase();

  // ---------- lectura ----------

      let text;
      try { text = new TextDecoder(enc.toLowerCase()).decode(u8); } catch (e) { text = new TextDecoder('windows-1252').decode(u8); }
      wb = XL().read(text, { type: 'string', raw: true });
    } else {
      wb = XL().read(u8, { type: 'array', raw: true });

  }

  function identify(aoa, filename) {
    for (let i = 0; i < Math.min(10, aoa.length); i++) {
      const r = aoa[i] || [];
      for (let j = 0; j < r.length; j++) {
        if (str(r[j]) === 'Reporte:') {
          for (let k = j + 1; k < r.length; k++) if (str(r[k])) { const code = str(r[k]); return BY_CODE[code] ? BY_CODE[code].key : null; }
        }

    if (h.includes('no_prest') && h.includes('feci_mes')) return 'feci';
    return null;
  }

  function reportMeta(aoa) {
    const lines = aoa.slice(0, 8).map(r => (r || []).map(str).filter(Boolean).join(' | '));
    const text = lines.join('\n');
    let month = null, vote = false, title = str((aoa[1] || [])[0]) || str((aoa[0] || [])[0]);
    let m = text.match(/AL CIERRE\s+(\d{4})(\d{2})/i);
    if (m) { month = `${m[1]}-${m[2]}`; vote = true; }
    if (!month) { m = text.match(/del\s+(\d\d)\/(\d\d)\/(\d{4})\s+al\s+(\d\d)\/(\d\d)\/(\d{4})/i); if (m) { month = `${m[6]}-${m[5]}`; vote = true; } }

  }

  // Recorre filas de detalle (contrato en col 0) llevando el grupo vigente
  function walk(aoa, groupTest) {

  const PARSERS = {
    cierre(aoa) {

        id: str(r[0]), nombre: str(r[1]), monto: num(r[2]), saldo: num(r[3]), fprest: serialToISO(r[4]), fult: serialToISO(r[5]), fvenc: serialToISO(r[6]),
        dias: num(r[7]), corriente: num(r[8]), aging: [9, 10, 11, 12, 13, 14, 15].map(i => num(r[i])), totalMoroso: num(r[17]), sucursal: group
      }));
    },
    moraFecha(aoa) { return PARSERS.cierre(aoa); },
    rubros(aoa) {

        id: str(r[0]), suc: num(r[1]), fprest: serialToISO(r[2]), fvenc: serialToISO(r[3]), nombre: str(r[4]), cedula: str(r[5]), cedulaRaw: r[5], tint: r[6], niv: str(r[7]),
        gm: r[8], letra: num(r[9]), freq: str(r[10]), monto: num(r[11]), fult: serialToISO(r[12]), moraFecha: r[13], moraMonto: r[14],
        saldo: num(r[15]), svp: num(r[16]), capital: num(r[17]), interes: num(r[18]), manejo: num(r[19]), feci: num(r[20]), segVida: num(r[21])
      }));
    },
    _cartera(aoa, groupRe) {
      return walk(aoa, (c0, r) => groupRe.test(c0) && onlyFirst(r) ? { group: c0 } : null).map(({ r, group }) => ({
        id: str(r[0]), suc: num(r[1]), fprest: serialToISO(r[2]), nombre: str(r[3]), cedula: str(r[5]), monto: num(r[6]), saldo: num(r[7]),
        fini: serialToISO(r[8]), fvenc: serialToISO(r[9]), letra: num(r[10]), freq: str(r[11]), pagos: num(r[12]), fult: serialToISO(r[13]),
        corriente: num(r[14]), moroso: num(r[15]), letrasMorosas: num(r[16]), factXCobrar: num(r[17]), oficial: str(r[18]), refi: str(r[19]), group

    producto(aoa) { return PARSERS._cartera(aoa, /^PRODUCTO:/).map(x => (x.producto = str(x.group).replace(/^PRODUCTO:\s*/, ''), x)); },
    productoEsp(aoa) { return PARSERS.producto(aoa); },
    banca(aoa) { return PARSERS._cartera(aoa, /^BANCA\b/i).map(x => (x.banca = str(x.group), x)); },
    patrono(aoa) {

    especial(aoa) {

    },
    _moro(aoa, re) {

    moraProducto(aoa) { return PARSERS._moro(aoa, /^PRODUCTO:/); },

    recaudo(aoa) {

    pagos(aoa) {

        id: str(r[0]), nombre: str(r[2]), recibo: str(r[4]), fecha: serialToISO(r[5]), caja: num(r[6]), cxcAgencia: num(r[7]), capital: num(r[8]),
        intereses: num(r[9]), feci: num(r[10]), segVida: num(r[11]), segBien: num(r[12]), cargoLegal: num(r[13]), ingresoMora: num(r[14]),
        ingresosVarios: num(r[15]), ingresoMalas: num(r[16]), devIntereses: num(r[17]), devFeci: num(r[18]), devSegVida: num(r[19]), devExceso: num(r[20])
      }));
    },
    intereses(aoa) {
      return walk(aoa, (c0, r) => /^C[óo]digo de Producto/i.test(c0) ? { group: c0.replace(/^C[óo]digo de Producto:\s*\d+\s*-\s*/i, '') } : null).map(({ r, group }) => ({
        id: str(r[0]), nombre: str(r[2]), producto: group,
        intTotal: num(r[5]), intMes: num(r[6]) + num(r[7]), intMesC: num(r[6]), intMesXC: num(r[7]), intAcum: num(r[8]), intSaldo: num(r[9]),
        gmTotal: num(r[10]), gmMes: num(r[11]) + num(r[12]), gmAcum: num(r[13]), gmSaldo: num(r[14])

    cancelados(aoa) {

    vencidos(aoa) { return PARSERS._venc(aoa); },

        id: str(r[ix('no_prest')]), feci: num(r[ix('feci')]), feciDeven: num(r[ix('feci_deven')]), feciMes: num(r[ix('feci_mes')]), saldoFeci: num(r[ix('saldo_feci')]), pagosMes: num(r[ix('pagos_mes')]), estatus: str(r[ix('estatus')])
      }));
    }
  };

  // Lee un archivo -> objeto reporte
  function readReport(buf, filename) {
    const aoa = bufToAOA(buf, filename);
    const key = identify(aoa, filename);
    const meta = reportMeta(aoa);
    let rows = [];
    if (key && PARSERS[key]) { try { rows = PARSERS[key](aoa, meta); } catch (e) { console.error(key, e); } }
    return { key, filename, name: key ? BY_KEY[key].name : 'No reconocido', meta, aoa, rows };
  }

  function batchMonth(reports) {
    const votes = {};
    reports.forEach(r => { if (r.meta.vote && r.meta.month) votes[r.meta.month] = (votes[r.meta.month] || 0) + (r.key === 'cierre' ? 5 : 1); });
    const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
    if (best) return best[0];
    const p = reports.map(r => r.meta.printed).filter(Boolean).sort()[0];
    if (p) { let [y, m] = p.split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return `${y}-${String(m).padStart(2, '0')}`; }
    return null;
  }

  // ---------- modelo ----------
  function buildModel(reports, config) {
    config = config || DEFAULT_CONFIG;
    const R = {}; reports.forEach(r => { if (!r.key) return; if (BY_KEY[r.key].multi) (R[r.key] = R[r.key] || []).push(...r.rows); else R[r.key] = r.rows; });
    const month = batchMonth(reports);
    const idx = arr => { const m = new Map(); (arr || []).forEach(x => m.set(x.id, x)); return m; };
    const I = {}; ['rubros', 'patrono', 'producto', 'banca', 'especial', 'moraFecha', 'intereses', 'feci', 'productoEsp'].forEach(k => I[k] = idx(R[k]));
    const segv = new Map(); (R.segvida || []).forEach(s => segv.set(s.id, s));
    const pagado = new Map(); const pagosN = new Map();
    (R.recaudo || []).forEach(p => { pagado.set(p.id, (pagado.get(p.id) || 0) + p.total); pagosN.set(p.id, (pagosN.get(p.id) || 0) + 1); });

    let base = R.cierre;
    let baseFrom = 'cierre';
    if (!base || !base.length) { base = (R.producto || R.patrono || R.banca || []).map(x => ({ id: x.id, nombre: x.nombre, monto: x.monto, saldo: x.saldo, fprest: x.fprest, fult: x.fult, fvenc: x.fvenc, dias: null, corriente: x.corriente, aging: null, totalMoroso: x.moroso })); baseFrom = 'cartera'; }

    const loans = base.map(c => {
      const ru = I.rubros.get(c.id) || {}; const pa = I.patrono.get(c.id) || {}; const pr = I.producto.get(c.id) || I.productoEsp.get(c.id) || {};
      const ba = I.banca.get(c.id) || {}; const es = I.especial.get(c.id) || {}; const mf = I.moraFecha.get(c.id); const it = I.intereses.get(c.id) || {};
      const fe = I.feci.get(c.id) || {}; const sv = segv.get(c.id) || {};

      const dias = c.dias != null ? c.dias : (cart.letrasMorosas ? cart.letrasMorosas * 15 : 0);
      const b = bucketOf(dias);
      const freq = cart.freq || ru.freq || '';
      const letra = cart.letra || ru.letra || 0;
      const patronoRaw = pa.patrono || '';
      return {
        id: c.id, nombre: c.nombre || cart.nombre || ru.nombre, cedula: cart.cedula || ru.cedula || '', suc: cart.suc || ru.suc || 0,
        sucursal: c.sucursal || es.sucursal || (cart.suc ? 'Sucursal ' + cart.suc : '—'),
        producto: (pr.producto || es.producto || '—').replace(/^BANCA PERSONAL-/, ''), productoFull: pr.producto || es.producto || '—',
        banca: ba.banca || 'BANCA PERSONAL', patrono: patronoRaw || '—', patronoCode: pa.patronoCode || '', patronoGSF: (config.patronoMap || {})[patronoRaw] || patronoRaw,
        oficial: cart.oficial || '—', refi: cart.refi || '', monto: c.monto, saldo: c.saldo, fprest: c.fprest, fini: cart.fini, fvenc: c.fvenc, fult: c.fult,
        letra, freq, cuotaMes: letra * freqFactor(freq), dias, bucket: b, clas: BUCKETS[b], corriente: c.corriente, aging: c.aging, totalMoroso: c.totalMoroso,
        letrasMorosas: cart.letrasMorosas || 0, factXCobrar: cart.factXCobrar || 0, morosoCartera: cart.moroso || 0,
        diasHoy: mf ? mf.dias : null, morosoHoy: mf ? mf.totalMoroso : null,
        estado: ru.niv === 'V' ? 'Vencido' : 'Vigente', rub: ru, valorPresente: es.valorPresente || 0,
        intMes: it.intMes || 0, gmMes: it.gmMes || 0, feciMes: fe.feciMes || 0, segPrima: sv.prima || 0, aseguradora: sv.aseguradora || '',
        pagadoMes: r2(pagado.get(c.id) || 0), pagosMes: pagosN.get(c.id) || 0,
        migrado: /MIGRAD/i.test(pr.producto || es.producto || '')

    });

    loans.forEach(l => {
      l.letrasMes = Math.min(letrasEnMes(l, month), Math.max(0, l.saldo));
      l.letrasSig = Math.round(Math.min(letrasEnMes(l, nx), Math.max(0, l.corriente)) * 100) / 100;
    });
    return { month, baseFrom, loans, R, reportsLoaded: reports.filter(r => r.key).map(r => r.key) };
  }

  // ---------- agregados ----------
  function groupSum(loans, keyFn, extra) {
    const m = new Map();
    for (const l of loans) {
      const k = keyFn(l); let g = m.get(k);
      if (!g) { g = { k, n: 0, saldo: 0, moroso: 0, enMora: 0, par30: 0, corriente: 0, cuotaMes: 0, pagado: 0 }; m.set(k, g); }
      g.n++; g.saldo += l.saldo; g.moroso += l.totalMoroso; g.corriente += l.corriente; g.cuotaMes += l.cuotaMes; g.pagado += l.pagadoMes;
      if (l.bucket > 0) { g.enMora++; g.par30 += l.saldo; }
      if (extra) extra(g, l);
    }
    return [...m.values()].map(g => { for (const k in g) if (typeof g[k] === 'number' && k !== 'n' && k !== 'enMora') g[k] = r2(g[k]); return g; }).sort((a, b) => b.saldo - a.saldo);
  }

  // mode 'mes' = letras del mes del cierre (para medir lo cobrado ese mes); 'sig' = letras del mes siguiente (meta a fijar)
  function computeMeta(loans, cfg, mode) {
    const c = Object.assign({}, DEFAULT_CONFIG.meta, cfg || {});
    const sig = mode === 'sig';
    const rows = BUCKETS.map((b, i) => ({ k: b, n: 0, saldo: 0, moroso: 0, cuotas: 0, cuotasAll: 0, cuotasMes: 0, metaCuotas: 0, metaRecup: 0, real: 0 }));
    let metaTotal = 0;
    const perLoan = new Map();
    for (const l of loans) {
      const row = rows[l.bucket];
      row.n++; row.saldo += l.saldo; row.moroso += l.totalMoroso; row.real += l.pagadoMes;
      const lt = sig ? (l.letrasSig != null ? l.letrasSig : Math.min(l.cuotaMes, l.saldo)) : (l.letrasMes != null ? l.letrasMes : Math.min(l.cuotaMes, l.saldo));
      const mc = (l.dias <= c.cuotaHastaDias && l.saldo > 0) ? lt * c.efectividadCuotas / 100 : 0;
      const mr = l.totalMoroso * (c.recupera[l.bucket] || 0) / 100;
      row.cuotas += (l.dias <= c.cuotaHastaDias) ? lt : 0;
      row.cuotasAll += l.letrasSig != null ? l.letrasSig : (l.saldo > 0 ? Math.min(l.cuotaMes, l.saldo) : 0);
      row.cuotasMes += l.letrasMes != null ? l.letrasMes : (l.saldo > 0 ? Math.min(l.cuotaMes, l.saldo) : 0); row.metaCuotas += mc; row.metaRecup += mr;
      perLoan.set(l.id, mc + mr); metaTotal += mc + mr;

  function letrasEstado(md, mode) {

    const by = (f) => { const m = new Map(); rows.forEach(x => { const k = f(x); const g = m.get(k) || { k, n: 0, lt: 0, cob: 0, falta: 0 }; g.n++; g.lt += x.lt; g.cob += Math.min(x.l.pagadoMes, x.lt); g.falta += x.falta; m.set(k, g); }); return [...m.values()]; };
    return { rows, porEstado: ['Pagó', 'Parcial', 'No pagó'].map(e => by(x => x.est).find(g => g.k === e) || { k: e, n: 0, lt: 0, cob: 0, falta: 0 }), porSuc: by(x => x.suc).sort((p, q) => q.lt - p.lt), total: rows.reduce((s, x) => s + x.lt, 0), cobrado: rows.reduce((s, x) => s + Math.min(x.l.pagadoMes, x.lt), 0) };

      const buf = await gunzipBytes(a.data);
      let rp; try { rp = C.readReport(buf, a.nombre); } catch (e) { rp = { key: null, filename: a.nombre, name: a.nombre, meta: {}, aoa: [], rows: [] }; }
      rp.raw = buf; out.push(rp);
    }
    return out;
  }

  async function handleFiles(files) {
    if (!puede('saveMonth')) { toast('Tu rol solo permite consultar. Pide a Administración que te cambie el rol para cargar reportes.', 6000); return; }
    files = files.filter(f => /\.xlsx?$/i.test(f.name)); if (!files.length) return;
    loader(true, 'Leyendo reportes…', 5);
    try {
      await loadScript('xlsx');
      const out = [];
      for (let i = 0; i < files.length; i++) {
        loader(true, `Leyendo ${i + 1} de ${files.length}: ${files[i].name.slice(0, 40)}`, 5 + 80 * i / files.length);
        const buf = await files[i].arrayBuffer();
        await new Promise(r => setTimeout(r, 10));
        try { const rp = C.readReport(buf, files[i].name); rp.raw = buf; out.push(rp); } catch (e) { console.error(e); out.push({ key: null, filename: files[i].name, name: 'No se pudo leer', meta: {}, aoa: [], rows: [] }); }
      }
      const known = out.filter(r => r.key);
      if (!known.length) { loader(false); toast('No reconocí ningún reporte del SIF en esos archivos.', 5000); return; }
      const month = C.batchMonth(known);
      if (!month) { loader(false); toast('No pude detectar el mes de los reportes.', 5000); return; }
      // Si ya hay reportes del mismo mes en sesión, se combinan (el nuevo reemplaza al mismo tipo)
      const prev = S.models[month] ? S.models[month].reports : [];
      const merged = prev.filter(r => !out.some(n => n.key && n.key === r.key && !C.BY_KEY[r.key].multi)).concat(out);
      loader(true, 'Calculando indicadores…', 90);
      await new Promise(r => setTimeout(r, 10));
      const md = C.buildModel(merged.filter(r => r.key), S.config);
      md.month = month;
      const ag = C.aggregate(md, S.config);
      try { const rc = C.reconcile(merged.filter(r => r.key), md, ag); ag.cuadre = { total: rc.length, ok: rc.filter(x => x.ok).length, explicadas: rc.filter(x => !x.ok && x.nota).length }; } catch (e) { console.error(e); }
      S.models[month] = { model: md, reports: merged };
      S.history[month] = ag; S.current = month;
      const saved = await saveMonth(ag, md, merged);
      if (saved === 'sheets') S.saveErr = null;
      loader(false);
      const unk = out.filter(r => !r.key).length;
      const cq = ag.cuadre; toast(`${C.monthLabel(month)}: ${known.length} reportes leídos${unk ? `, ${unk} sin reconocer` : ''}.${cq ? ` Cuadre: ${cq.ok} de ${cq.total} exactos${cq.total - cq.ok - cq.explicadas ? `, ${cq.total - cq.ok - cq.explicadas} por revisar` : ''}.` : ''}${saved === 'sheets' ? ` Guardado completo en Google Sheets (detalle y ${merged.filter(r => r.raw).length} reportes originales).` : ''}`, 8000);
      renderAll(); go('resumen');
    } catch (e) { loader(false); console.error(e); toast('Error al leer: ' + e.message, 6000); }
  }

  // ---------- arrastrar y soltar en toda la página (archivos o carpetas) ----------
  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  function readEntry(entry) {
    return new Promise(res => {
      if (!entry) return res([]);
      if (entry.isFile) entry.file(f => res([f]), () => res([]));
      else if (entry.isDirectory) {
        const rd = entry.createReader(); const all = [];
        const next = () => rd.readEntries(async ents => { if (!ents.length) { const nested = await Promise.all(all.map(readEntry)); res(nested.flat()); } else { all.push(...ents); next(); } }, () => res([]));
        next();
      } else res([]);
    });
  }
  async function filesFromDrop(dt) {
    const items = [...(dt.items || [])].filter(i => i.kind === 'file');
    const entries = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null);
    if (entries.length && entries.every(Boolean)) { const lists = await Promise.all(entries.map(readEntry)); const out = lists.flat(); if (out.length) return out; }
    return [...(dt.files || [])];
  }
  document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  document.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  document.addEventListener('drop', async e => {
    if (!e.dataTransfer) return; e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const files = await filesFromDrop(e.dataTransfer);
    const ok = files.filter(f => /\.xlsx?$/i.test(f.name));
    if (!ok.length) { toast(files.length ? 'Esos archivos no son Excel (.xls / .xlsx).' : 'No llegaron archivos. Prueba con el botón Cargar mes.', 5000); return; }
    handleFiles(ok);
  });

  // ---------- navegación ----------
  const VIEWS = { resumen: renderResumen, morosidad: renderMora, analisis: renderAnalisis, meta: renderMeta, ingresos: renderIngresos, excel: renderExcel, presentacion: renderPres, cuadre: renderCuadre, reportes: renderReportes, cargar: renderCargar, usuarios: renderUsuarios };
  const rendered = {};
  function go(tab) {
    if (!VIEWS[tab]) tab = 'resumen';
    S.tab = tab;
    if (location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } }
    $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === tab));
    $$('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + tab));
    if (rendered[tab] !== S.current + '|' + renderStamp) { Object.keys(charts).forEach(id => { if (document.getElementById(id) && document.getElementById(id).closest('#v-' + tab)) { charts[id].dispose(); delete charts[id]; } }); VIEWS[tab](); rendered[tab] = S.current + '|' + renderStamp; }
    setTimeout(() => Object.entries(charts).forEach(([id, c]) => { const el = document.getElementById(id); if (el && el.offsetParent) c.resize(); }), 60);
    const a = $(`#tabs a[data-v="${tab}"]`); if (a && a.scrollIntoView) a.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }
  let renderStamp = 0;
  const gsLoading = {};
  function renderAll() {
    renderStamp++; renderMonthSel(); go(S.tab);
    const ym = S.current;
    if (ym && !S.models[ym] && S.gsDetalle[ym] && gsOn() && puede('getModel') && !gsLoading[ym]) {
      gsLoading[ym] = true; loader(true, 'Trayendo el detalle de ' + C.monthLabel(ym) + ' desde Google Sheets…', 50);
      gsLoadModel(ym).then(md => { loader(false); if (md) { S.models[ym] = { model: md, reports: [], fromSheets: true }; if (S.current === ym) renderAll(); } })
        .catch(e => { loader(false); toast('No se pudo traer el detalle: ' + e.message, 6000); }).finally(() => { gsLoading[ym] = false; });
    }
  }
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  $$('#tabs a').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.v); });
  $('#monthSel').onchange = e => { S.current = e.target.value; renderAll(); };
  $('#btnUpload').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };

  // ---------- acceso: usuario y contraseña (los valida el Apps Script; fuera de Claude) ----------
  const CUBE = '<div class="cube" style="width:46px;height:46px;margin:0 auto 14px"><div class="c"><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div></div></div>';
  const red = t => '<span style="color:#f87171">' + esc(t) + '</span>';
  function modal(inner) { const el = document.createElement('div'); el.className = 'lock'; el.innerHTML = `<div class="card lockbox">${CUBE}<h2 style="text-align:center">Cartera GSF · Dashboard</h2>${inner}</div>`; document.body.appendChild(el); return el; }
  function changePwDialog(forced) {
    return new Promise(resolve => {
      const el = modal(`<p class="muted" style="text-align:center;margin:6px 0 18px">${forced ? 'Tu contraseña es temporal: crea una nueva para continuar.' : 'Cambiar mi contraseña'}</p>
        <form id="cpF" class="ctrl" style="gap:10px"><input class="inp" id="cpA" type="password" placeholder="Contraseña actual" autocomplete="current-password"><input class="inp" id="cpN" type="password" placeholder="Contraseña nueva (mínimo 8)" autocomplete="new-password"><input class="inp" id="cpN2" type="password" placeholder="Repite la nueva" autocomplete="new-password">
        <button class="btn pri" type="submit" style="justify-content:center">Guardar</button>${forced ? '' : '<button type="button" class="btn sm ghost" id="cpX" style="justify-content:center">Cancelar</button>'}<div class="note" id="cpM" style="text-align:center;min-height:18px"></div></form>`);
      const msg = t => $('#cpM', el).innerHTML = t;
      $('#cpX', el) && ($('#cpX', el).onclick = () => { el.remove(); resolve(false); });
      $('#cpF', el).onsubmit = async e => {
        e.preventDefault(); const n = $('#cpN', el).value;
        if (n.length < 8) return msg(red('Usa al menos 8 caracteres.'));
        if (n !== $('#cpN2', el).value) return msg(red('Las contraseñas no coinciden.'));
        msg('Guardando…');
        try { await gsPost({ action: 'changePassword', actual: $('#cpA', el).value, nueva: n }); el.remove(); resolve(true); } catch (er) { msg(red(er.message)); }
      };
    });
  }
  function lockScreen() {
    return new Promise(resolve => {
      const g = gsCfg(), askUrl = !g.url;
      const el = modal(`<p class="muted" id="lkT" style="text-align:center;margin:6px 0 18px">Inicia sesión para entrar.</p>
        <form id="lkF" class="ctrl" style="gap:10px">
          <input class="inp" id="lkUrl" placeholder="URL de la aplicación web de Apps Script (…/exec)" style="${askUrl ? '' : 'display:none'}" value="${esc(g.url)}">
          <input class="inp" id="lkNom" placeholder="Tu nombre completo" style="display:none" autocomplete="name">
          <input class="inp" id="lkMail" type="email" placeholder="Tu correo" style="display:none" autocomplete="email" autocapitalize="none">
          <input class="inp" id="lkU" placeholder="Usuario" autocomplete="username" autocapitalize="none" autofocus>
          <input class="inp" id="lkP" type="password" placeholder="Contraseña" autocomplete="current-password">
          <input class="inp" id="lkP2" type="password" placeholder="Repite la contraseña" autocomplete="new-password" style="display:none">
          <button class="btn pri" id="lkB" type="submit" style="justify-content:center">Entrar</button>
          <div class="note" id="lkM" style="text-align:center;min-height:18px"></div>
          <button type="button" class="btn sm ghost" id="lkReg" style="justify-content:center;display:none">¿No tienes cuenta? Solicitar acceso</button>
          ${GS_FIXED ? '' : `<button type="button" class="btn sm ghost" id="lkChg" style="justify-content:center;${askUrl ? 'display:none' : ''}">Usar otra base de datos</button>`}
        </form>`);
      const msg = t => $('#lkM', el).innerHTML = t;
      let mode = 'login';
      const setMode = m => {
        mode = m; const creating = m === 'setup' || m === 'crear' || m === 'registro';
        $('#lkNom', el).style.display = m === 'setup' || m === 'registro' ? '' : 'none';
        $('#lkMail', el).style.display = m === 'setup' || m === 'registro' ? '' : 'none';
        $('#lkReg', el).style.display = m === 'login' || m === 'registro' ? '' : 'none';
        $('#lkReg', el).textContent = m === 'registro' ? 'Ya tengo cuenta: iniciar sesión' : '¿No tienes cuenta? Solicitar acceso';
        $('#lkP2', el).style.display = creating ? '' : 'none';
        $('#lkP', el).autocomplete = creating ? 'new-password' : 'current-password';
        $('#lkT', el).textContent = m === 'setup' ? 'Primera vez: crea la cuenta de administración (contraseña de mínimo 8 caracteres).' : m === 'crear' ? 'Crea tu contraseña nueva (mínimo 8 caracteres).' : m === 'registro' ? 'Solicita acceso. Administración debe aprobarte; te llegará un correo.' : 'Inicia sesión para entrar.';
        $('#lkB', el).textContent = m === 'setup' ? 'Crear cuenta y entrar' : m === 'crear' ? 'Crear contraseña y entrar' : m === 'registro' ? 'Enviar solicitud' : 'Entrar';
        $('#lkU', el).placeholder = m === 'registro' ? 'Elige un usuario (ej. maria.perez)' : 'Usuario';
        msg('');
      };
      const probe = async () => {
        $('#lkB', el).disabled = true; $('#lkT', el).textContent = 'Conectando…';
        try { const st = await gsCall({ action: 'setupStatus' }, 30000); if (st.necesitaConfiguracion) setMode('setup'); else if (mode !== 'registro') setMode('login'); } catch (e) { setMode('login'); msg(red('No se pudo conectar con Apps Script: ' + e.message)); }
        $('#lkB', el).disabled = false;
      };
      $('#lkReg', el).onclick = () => setMode(mode === 'registro' ? 'login' : 'registro');
      $('#lkChg', el) && ($('#lkChg', el).onclick = () => { $('#lkUrl', el).style.display = ''; $('#lkUrl', el).focus(); });
      $('#lkUrl', el).onchange = () => { const u = $('#lkUrl', el).value.trim(); if (okUrl(u)) { g.url = u; gsRemember(); probe(); } };
      $('#lkF', el).onsubmit = async e => {
        e.preventDefault();
        const url = $('#lkUrl', el).value.trim(), usuario = $('#lkU', el).value.trim().toLowerCase(), pw = $('#lkP', el).value;
        if (!okUrl(url)) return msg(red('Falta la URL de Apps Script.'));
        if (!usuario || !pw) return msg(red('Escribe tu usuario y contraseña.'));
        if (url !== g.url) { g.url = url; gsRemember(); }
        if (mode !== 'login') {
          if (pw.length < 8) return msg(red('Usa al menos 8 caracteres.'));
          if (pw !== $('#lkP2', el).value) return msg(red('Las contraseñas no coinciden.'));
        }
        if (mode === 'registro' || mode === 'setup') {
          if (!$('#lkNom', el).value.trim()) return msg(red('Escribe tu nombre.'));
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('#lkMail', el).value.trim())) return msg(red('Escribe un correo válido.'));
        }
        msg(mode === 'registro' ? 'Enviando solicitud…' : 'Verificando…');
        if (mode === 'registro') {
          try {
            await gsCall({ action: 'register', usuario, nombre: $('#lkNom', el).value.trim(), email: $('#lkMail', el).value.trim(), password: pw, appUrl: (location.origin + location.pathname) });
            ['#lkP', '#lkP2'].forEach(k => $(k, el).value = ''); setMode('login'); $('#lkU', el).value = usuario;
            msg('<span style="color:#34d399">Solicitud enviada. Te llegará un correo cuando Administración la apruebe.</span>');
          } catch (er) { msg(red(er.message)); }
          return;
        }
        try {
          if (mode === 'setup') await gsCall({ action: 'setupAdmin', usuario, nombre: $('#lkNom', el).value.trim(), email: $('#lkMail', el).value.trim(), password: pw });
          if (mode === 'crear') await gsCall({ action: 'createPassword', usuario, password: pw });
          const d = await gsCall({ action: 'login', usuario, password: pw });
          g.token = d.token; g.me = d.me; gsRemember();
          if (d.debeCambiar) { el.style.display = 'none'; await changePwDialog(true); }
          S.gsStatus = 'ok'; el.remove(); resolve();
        } catch (er) {
          if (er.message === 'CREAR_CLAVE') { setMode('crear'); msg('Tu contraseña fue restablecida: crea una nueva.'); return; }
          msg(red(er.message));
        }
      };
      if (!askUrl) probe();
    });
  }
  async function needsLock() {
    if (window.claude) return false; // dentro de Claude el artifact ya es privado y no puede salir a Google
    const g = gsCfg();
    if (g.url && g.token) {
      try { const p = await gsGet({ action: 'ping' }); g.me = p.me; gsRemember(); S.gsStatus = 'ok'; S.pendientes = p.pendientes || 0; return false; }
      catch (e) { if (e.message === 'DEBE_CAMBIAR') { await changePwDialog(true); S.gsStatus = 'ok'; return false; } return true; }
    }
    return true;
  }
  window.gsfLogout = async () => { const g = gsCfg(); try { if (g.token) await gsCall({ action: 'logout' }, 10000); } catch (e) { } g.token = ''; g.me = null; gsRemember(); location.reload(); };

  // ---------- inicio ----------
  (async function init() {
    if (await needsLock()) await lockScreen();
    loadScript('xlsx').catch(() => { });
    try { await loadScript('echarts'); } catch (e) { toast(e.message, 8000); }
    await storeInit();
    S.current = months().slice(-1)[0] || null;
    const h = location.hash.slice(1); S.tab = VIEWS[h] ? h : 'resumen';
    renderAll();
    if (!window.claude && gsOn()) $('#btnLogout').style.display = '';
    aplicarPermisos();
    if (!window.claude && gsOn() && puede('usuarios')) gsGet({ action: 'ping' }).then(p => { S.pendientes = p.pendientes || 0; aplicarPermisos(); }).catch(() => { });
    capUse('downloads').then(d => S.downloads = d);
  })();
})();
</script>
</body></html>
